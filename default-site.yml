---
site:
  title: Confidential Containers
  url: https://www.redhat.com/en/blog/learn-about-confidential-containers
  start_page: modules::index.adoc

content:
  sources:
    - url: .
      start_path: content

ui:
  bundle:
    url: https://github.com/rhpds/rhdp_showroom_theme/releases/download/v0.0.1/ui-bundle.zip
    snapshot: true
  supplemental_files:
    - path: ./content/supplemental-ui
    - path: ./content/lib
    - path: .nojekyll
    - path: ui.yml
      contents: "static_files: [ .nojekyll ]"
    - path: partials/head-styles.hbs
      contents: |
        <link rel="stylesheet" href="{{{uiRootPath}}}/css/site.css">
        <link rel="stylesheet" href="{{{uiRootPath}}}/css/execute-tracker.css">
    - path: partials/footer-scripts.hbs
      contents: |
        <script src="{{uiRootPath}}/js/vendor/clipboard.js"></script>
        <script src="{{uiRootPath}}/js/site.js"></script>
        <script async src="{{uiRootPath}}/js/vendor/highlight.js"></script>
        <script src="{{uiRootPath}}/js/vendor/execute-tracker.js"></script>
    - path: css/execute-tracker.css
      contents: |
        .doc .execute.is-copied pre.highlight code {
          background-color: #c8e6c9;
          transition: background-color 0.3s ease;
        }
        .doc .execute.is-copied .copy-button {
          background-image: url(../img/checkmark.svg);
          background-color: #c8e6c9;
          border-color: #2e7d32;
        }
    - path: js/vendor/execute-tracker.js
      contents: |
        document.addEventListener("DOMContentLoaded", function () {
          document.addEventListener("click", function (e) {
            var btn = e.target.closest(".execute .copy-button");
            if (!btn) return;
            var block = btn.closest(".execute");
            if (!block) return;
            setTimeout(function () {
              if (btn.getAttribute("aria-label") === "Copied!") {
                block.classList.add("is-copied");
              }
            }, 100);
          });
        });
    - path: img/checkmark.svg
      contents: |
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>

runtime:
  cache_dir: ./.cache/antora

asciidoc:
  extensions:
  - './content/lib/asam-asciidoctor_extensions-registered.js'

antora:
  extensions:
    - require: ./content/lib/dev-mode.js
      enabled: false
    - require: ./content/lib/asam-asciidoctor_extensions-registered.js
      enabled: true
output:
  dir: ./www
