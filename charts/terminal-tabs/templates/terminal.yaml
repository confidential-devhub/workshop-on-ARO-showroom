{{- $ns := .Values.namespaceOverride | default .Release.Namespace }}
{{- $bastion := .Values.bastion }}
{{- range .Values.terminals }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terminal-{{ .name }}
  namespace: {{ $ns }}
  labels:
    app: terminal-{{ .name }}
    app.kubernetes.io/part-of: showroom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: terminal-{{ .name }}
  template:
    metadata:
      labels:
        app: terminal-{{ .name }}
        app.kubernetes.io/part-of: showroom
    spec:
      containers:
        - name: wetty
          image: {{ $.Values.image }}
          imagePullPolicy: IfNotPresent
          args:
            - --base=/
            - --port=3000
            - --allow-iframe=true
            # Built with printf/quote so that passwords and paths containing
            # YAML special characters stay a single, literal argv element
            # (no shell is involved: this is the exec form).
            - {{ printf "--ssh-host=%s" $bastion.host | quote }}
            - {{ printf "--ssh-port=%v" $bastion.port | quote }}
            - {{ printf "--ssh-user=%s" $bastion.user | quote }}
            - --ssh-auth=password
            - {{ printf "--ssh-pass=%s" $bastion.password | quote }}
            - {{ printf "--command=export KUBECONFIG=%s; exec bash" .kubeconfig | quote }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
{{ toYaml $.Values.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: terminal-{{ .name }}
  namespace: {{ $ns }}
  labels:
    app: terminal-{{ .name }}
spec:
  selector:
    app: terminal-{{ .name }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: terminal-{{ .name }}
  namespace: {{ $ns }}
  labels:
    app: terminal-{{ .name }}
  annotations:
    haproxy.router.openshift.io/timeout: {{ $.Values.route.timeout }}
spec:
  host: {{ $.Values.route.hostPrefix }}-{{ if $.Values.route.hostSuffix }}{{ $.Values.route.hostSuffix }}-{{ end }}{{ .name }}.{{ $.Values.route.domain }}
  to:
    kind: Service
    name: terminal-{{ .name }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: {{ $.Values.route.tlsTermination }}
    insecureEdgeTerminationPolicy: {{ $.Values.route.insecurePolicy }}
---
{{- end }}
