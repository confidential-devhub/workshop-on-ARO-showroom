# Public keys used by the KBS image signature policy.
# Supplied at install time:
#   --set-file securityPolicy.devhubPublicKey=helpers/cosign.pub
#   --set-file securityPolicy.redhatPublicKey=<redhat cosign key>
apiVersion: v1
kind: Secret
metadata:
  name: conf-devhub-signature
  namespace: {{ .Values.namespaceOverride | default .Release.Namespace }}
type: Opaque
stringData:
  pub-key: |
{{ .Values.securityPolicy.devhubPublicKey | indent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: redhat-signature
  namespace: {{ .Values.namespaceOverride | default .Release.Namespace }}
type: Opaque
stringData:
  pub-key: |
{{ .Values.securityPolicy.redhatPublicKey | indent 4 }}
