# Image signature verification policy. Every image not listed is rejected.
# The policy is referenced from initdata.toml as:
#   kbs:///default/trustee-image-policy/policy
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.securityPolicy.policySecret.name | default "trustee-image-policy" }}
  namespace: {{ .Values.namespaceOverride | default .Release.Namespace }}
type: Opaque
stringData:
  {{ .Values.securityPolicy.policySecret.key | default "policy" }}: |
    {
      "default": [
        {
          "type": "reject"
        }
      ],
      "transports": {
        "docker": {
{{- range $index, $img := .Values.securityPolicy.signedImages }}
          "{{ $img.image }}": [
            {
              "type": "sigstoreSigned",
              "keyPath": "kbs:///default/{{ $img.signatureSecret }}/pub-key"
            }
          ]{{ if ne (add1 $index) (len $.Values.securityPolicy.signedImages) }},{{ end }}
{{- end }}
        }
      }
    }
